name: Daily Watchlist

on:
  workflow_dispatch:

jobs:
  watchlist:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Watchlist
        run: python daily_watchlist.py
