name: Breakout Monitor

on:
  workflow_dispatch:

jobs:
  breakout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Breakout Monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python breakout_monitor.py

      - name: Commit updated waiting signals
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add waiting_signals.json

          git commit -m "Update waiting signal status" || echo "No changes to commit"

          git push
